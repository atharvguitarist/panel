name: Build and publish firmware

# Push a new sketch/Panel/Panel.ino -> GitHub compiles it, reads the version
# from the binary, writes firmware/latest.bin + manifest.json, commits them and
# redeploys the page. The panel's phone page then offers the update.
on:
  push:
    branches: [main]
    paths: ["sketch/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Tools menu in Arduino IDE: PSRAM = OPI PSRAM, Partition Scheme = Minimal SPIFFS.
  FQBN: "esp32:esp32:esp32s3:PSRAM=opi,PartitionScheme=min_spiffs,FlashMode=qio"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Read library versions
        run: |
          grep -E '^[A-Z0-9_]+=[0-9.]+$' sketch/versions.env >> "$GITHUB_ENV"

      - name: Check the sketch folder is complete
        run: |
          test -f sketch/Panel/Panel.ino        || { echo "::error::sketch/Panel/Panel.ino is missing"; exit 1; }
          test -f sketch/lv_conf.h              || { echo "::error::sketch/lv_conf.h is missing - copy it from d:\\sketchbook\\libraries"; exit 1; }
          test -f sketch/libraries/figtree_fonts/library.properties || ls sketch/libraries/figtree_fonts/*.h >/dev/null 2>&1 \
                                                || { echo "::error::sketch/libraries/figtree_fonts is empty - copy the folder from d:\\sketchbook\\libraries"; exit 1; }

      - name: Install arduino-cli, ESP32 core and libraries
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
          arduino-cli lib install "lvgl@${LVGL_VER}" "LovyanGFX@${LOVYAN_VER}" "ArduinoJson@${ARDUINOJSON_VER}"
          # lvgl looks for lv_conf.h in the folder that contains the lvgl folder
          cp sketch/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compile
        run: |
          # PANEL_CRASH_NOTE + the --wrap flag switch on the crash recorder in
          # the sketch: a panic is written to the activity log on the next boot.
          arduino-cli compile --fqbn "$FQBN" --libraries sketch/libraries \
            --build-property "compiler.cpp.extra_flags=-DPANEL_CRASH_NOTE" \
            --build-property "compiler.c.elf.extra_flags=-Wl,--wrap=esp_panic_handler" \
            --output-dir out sketch/Panel

      - name: Export symbol table (turns a logged crash address into a function name)
        run: |
          NM=$(ls "$HOME"/.arduino15/packages/esp32/tools/xtensa-esp32s3-elf-gcc/*/bin/xtensa-esp32s3-elf-nm | head -1)
          "$NM" -n --defined-only out/Panel.ino.elf | awk '$2 ~ /^[tTwW]$/ {print $1, $3}' | gzip -9 > firmware/symbols.txt.gz
          ls -l firmware/symbols.txt.gz

      - name: Build report (run summary)
        run: |
          BIN=$(ls "$HOME"/.arduino15/packages/esp32/tools/xtensa-esp32s3-elf-gcc/*/bin | head -1)
          "$BIN/xtensa-esp32s3-elf-size" -A out/Panel.ino.elf > out/size.txt
          git show HEAD:firmware/manifest.json > out/prev.json 2>/dev/null || echo '{}' > out/prev.json
          python3 -I tools/build_report.py out/size.txt out/Panel.ino.bin out/prev.json sketch/versions.env >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Size check (slot is 1,966,080 bytes)
        run: |
          ls -l out
          SZ=$(stat -c %s out/Panel.ino.bin)
          echo "app image: $SZ bytes"
          [ "$SZ" -gt 800000 ] && [ "$SZ" -lt 1966080 ] || { echo "::error::image size $SZ is outside the expected range"; exit 1; }
          cp out/Panel.ino.bin firmware/Panel.ino.bin

      - name: Build manifest (version, size, md5 read from the binary)
        id: pub
        run: python3 -I tools/publish.py

      - name: Commit
        if: steps.pub.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A firmware
          git commit -m "Build v${{ steps.pub.outputs.version }}"
          # The branch may have moved while the build ran (a README edit, the
          # next sketch push). Rebase our one commit onto it and push; three
          # tries covers another build landing in the same window.
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || exit 1
          done

      - name: Redeploy page
        if: steps.pub.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick it up on its own"
