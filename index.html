<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Controls</title>

<!-- Launches full-screen from the home screen on iOS, like an installed app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6E9CC">
<meta name="robots" content="noindex,nofollow">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<!--
  ONE page serves every panel ever shipped.

  The per-unit part arrives in the URL fragment (#t=<topic>), which the panel
  writes into its QR at runtime. Browsers never transmit a fragment to the
  server, so this host never learns which topic belongs to which customer --
  no logs to leak, nothing to store, no backend at all.

  Colours are the panel's own Rustic Radiance palette at their TRUE values.
  The firmware uses counter-tinted variants (burgundy 0x8E1E12 instead of
  0x7E102C) purely to fight the TFT's magenta shift -- a phone screen renders
  correctly, so the page uses the real palette and the two still read as one
  product side by side.

  INSTALLED-APP BEHAVIOUR: when a manifest is present, BOTH platforms launch
  the installed app at the manifest's start_url, not the page the user was
  on -- and on iOS the installed app's storage is a separate container from
  Safari's, so nothing stored during the first visit is visible afterwards.
  A static manifest therefore cannot work: its start_url has no topic.

  So the manifest is generated at runtime, after the topic is known, as a
  blob: URL whose start_url is this page's absolute URL WITH the #t= fragment.
  The installed app then launches with the topic in its own URL, no storage
  required. localStorage is kept as a second net, and the no-panel screen
  offers a paste box as a third.

  INSTALL PROMPT: Android Chrome fires beforeinstallprompt once the page has a
  manifest and a service worker with a real fetch handler (sw.js); the banner
  then offers a one-tap "Add" that opens the browser's own install sheet.
  iOS has no install API at all, so the banner shows the two taps instead.
  Neither banner ever renders inside the installed app.
-->

<style>
  :root {
    --bg:        #F6E9CC;   /* panel settings cream  */
    --card:      #FFFDF6;   /* panel card fill       */
    --line:      #E3D8B8;   /* panel hairline border */
    --shadow:    rgba(201,187,142,.55);
    --wine:      #7E102C;   /* Rustic Radiance burgundy */
    --wine-dark: #650B22;
    --rose:      #D7A9A8;   /* Rustic Radiance dusty rose */
    --ink:       #3D3830;
    --ink-soft:  #7A7366;
    --gold-text: #5F4712;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100svh;
    /* Full-screen on iPhone draws under the status bar; clear it, then breathe. */
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 20px
             calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex;
    justify-content: center;
  }

  .wrap { width: 100%; max-width: 440px; }

  /* ---- Header ---- */
  header { text-align: center; margin-bottom: 26px; }

  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold-text);
  }

  .topic-badge {
    margin-top: 8px;
    font-size: 12.5px;
    letter-spacing: .02em;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Buttons ---- */
  button {
    width: 100%;
    font-family: inherit;
    border-radius: 16px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, background-color .18s ease;
  }
  button:active { transform: translateY(1px) scale(.995); }
  button:disabled { opacity: .55; cursor: default; }

  .primary {
    padding: 30px 20px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: .04em;
    color: #FBEFE2;
    background: var(--wine);
    border: none;
    box-shadow: 0 6px 18px rgba(126,16,44,.26);
  }
  .primary:active { background: var(--wine-dark); }
  .primary.confirm { background: var(--wine-dark); }

  .grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .secondary {
    padding: 17px 10px;
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: .015em;
    color: var(--gold-text);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 2px 8px var(--shadow);
  }
  .secondary.wide { grid-column: 1 / -1; }
  .secondary.confirm {
    background: #F6E2AE;
    border-color: #A8842E;
    color: #5F4712;
  }

  /* A command the panel confirmed: a short gold tick on the button itself,
     the way a remote's LED blinks. Kept brief so it reads as feedback. */
  .primary.sent   { background: #A8842E; }
  .secondary.sent { background: #F6E2AE; border-color: #C9A85C; color: #5F4712; }

  /* ---- Status line ---- */
  .status {
    margin-top: 16px;
    min-height: 20px;
    text-align: center;
    font-size: 13.5px;
    color: var(--ink-soft);
    opacity: 0;
    transition: opacity .25s ease;
  }
  .status.show { opacity: 1; }
  .status.err  { color: #A3302B; }

  /* ---- Notifications card ---- */
  .rule {
    margin: 30px 0 24px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--line), transparent);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .card h2 {
    margin: 0 0 6px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--gold-text);
  }

  .card p {
    margin: 0 0 16px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-soft);
  }

  .topic-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .topic-row code {
    flex: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13.5px;
    color: var(--wine);
    word-break: break-all;
    line-height: 1.4;
  }

  .copy {
    flex: 0 0 auto;
    width: auto;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .04em;
    border-radius: 9px;
    color: var(--gold-text);
    background: #F6E2AE;
    border: 1px solid #C9A85C;
  }

  .stores {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }

  .stores a {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    color: var(--gold-text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 11px;
  }

  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 11.5px;
    line-height: 1.6;
    color: #9A9387;
  }

  .relink {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 10px;
    color: var(--gold-text);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ---- Add-to-home-screen banner ----
     Only exists while the page is open in a browser tab. Inside the installed
     app it is never rendered. Android gets a real one-tap install (the
     browser's own prompt); iPhone has no such API, so it gets a pointed
     two-step hint instead. */
  .install {
    display: none;
    align-items: center;
    gap: 12px;
    margin: -8px 0 18px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 2px 8px var(--shadow);
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-soft);
  }
  .install.show { display: flex; }
  .install strong { color: var(--ink); font-weight: 600; }
  .install .add {
    flex: 0 0 auto;
    width: auto;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .03em;
    color: #FBEFE2;
    background: var(--wine);
    border: none;
    border-radius: 11px;
  }
  .install .later {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    padding: 0;
    font-size: 18px;
    line-height: 1;
    color: var(--ink-soft);
    background: transparent;
    border: none;
  }
  .install svg { width: 17px; height: 17px; vertical-align: -3px; stroke: var(--ink); fill: none; stroke-width: 1.8; }
  .install .text { flex: 1; }

  /* ---- Update row ----
     Absent unless the panel answered with its version AND the published
     release is newer. One quiet line, one button. */
  .update {
    display: none;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 2px 8px var(--shadow);
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-soft);
  }
  .update.show { display: flex; }
  .update .text { flex: 1; }
  .update strong { color: var(--ink); font-weight: 600; }
  .update button {
    flex: 0 0 auto;
    width: auto;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .03em;
    color: #FBEFE2;
    background: var(--wine);
    border: none;
    border-radius: 11px;
  }
  .update button.confirm { background: var(--wine-dark); }

  /* ---- Activity sheet ----
     Opens over the remote; the page itself never grows. Content is the
     relay's 12-hour cache, read by the phone -- the panel is never asked. */
  .sheet-bg {
    position: fixed; inset: 0;
    background: rgba(40,30,20,.35);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    z-index: 20;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-height: 72vh;
    margin: 0 auto; max-width: 480px;
    display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line); border-bottom: 0;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,.18);
    transform: translateY(105%);
    transition: transform .25s ease;
    z-index: 21;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet.open    { transform: none; }
  .sheet-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px 10px;
  }
  .sheet-head h2 {
    flex: 1; margin: 0;
    font-size: 14px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
    color: var(--gold-text);
  }
  .sheet-head small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-soft); }
  .sheet-head button {
    width: 32px; height: 32px; padding: 0; flex: 0 0 auto;
    font-size: 20px; line-height: 1; border-radius: 50%;
    color: var(--ink-soft); background: var(--bg); border: 1px solid var(--line);
  }
  .log { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 18px 14px; }
  .log-row {
    display: flex; gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--line);
    font-size: 13px; line-height: 1.4;
  }
  .log-row:first-child { border-top: 0; }
  .log-time { flex: 0 0 48px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .log-text { flex: 1; min-width: 0; color: var(--ink); word-break: break-word; }
  .log-text em { font-style: normal; color: var(--ink-soft); }
  .log-row.ok .log-text { color: var(--gold-text); }
  .log-empty { padding: 14px 0 10px; font-size: 13px; color: var(--ink-soft); text-align: center; }

  .update .steps { margin-top: 6px; font-size: 12px; color: var(--ink-soft); letter-spacing: .02em; }
  .update .steps b { color: var(--ink); font-weight: 600; }
  .update.fail strong { color: #A3302B; }
  .update.done strong { color: #2E6B3A; }
  @media (prefers-color-scheme: dark) {
    .update.done strong { color: #8FD19E; }
    .update.fail strong { color: #F08A84; }
  }

  /* Shown instead of everything when the link carries no topic. */
  .nolink {
    text-align: center;
    padding: 46px 24px;
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.6;
  }
  .nolink strong { color: var(--ink); display: block; margin-bottom: 8px; font-size: 16px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #16120F;
      --card:     #211B16;
      --line:     #3A2F25;
      --shadow:   rgba(0,0,0,.4);
      --ink:      #EDE3D2;
      --ink-soft: #A29684;
      --wine:     #96203C;
      --wine-dark:#7E102C;
      --gold-text:#E1C78E;
    }
    .secondary.confirm { background: #4A3A1A; border-color: #C9A85C; color: #F3DFB0; }
    .copy { background: #4A3A1A; border-color: #C9A85C; color: #F3DFB0; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <header>
    <h1>Home Panel</h1>
    <div class="topic-badge" id="badge"></div>
  </header>

  <div class="install" id="install" role="note">
    <div class="text" id="install-text"></div>
    <button class="add" id="install-add">Add</button>
    <button class="later" id="install-later" aria-label="Not now">&times;</button>
  </div>

  <button class="primary" id="btn-off">All Lights Off</button>

  <div class="grid">
    <button class="secondary" id="btn-status">Check Status</button>
    <button class="secondary" id="btn-log">Recent Alerts</button>
    <button class="secondary wide" id="btn-restart" data-confirm="1">Restart Panel</button>
  </div>

  <div class="update" id="update" role="status" aria-live="polite">
    <div class="text"><div id="update-text"></div><div class="steps" id="update-steps"></div></div>
    <button id="btn-upgrade">Update</button>
  </div>

  <div class="status" id="status"></div>

  <div class="rule"></div>

  <div class="card">
    <h2>Notifications</h2>
    <p>Get doorbell and motion alerts on this phone: install the free
       <strong>ntfy</strong> app and subscribe to this name.</p>

    <div class="topic-row">
      <code id="topic-text"></code>
      <button class="copy" id="btn-copy">Copy</button>
    </div>

    <div class="stores">
      <a href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noopener">iPhone</a>
      <a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">Android</a>
    </div>
  </div>

  <footer>
    <span id="foot">Add this page to your home screen for one-tap access.<br>
    Commands reach the panel from anywhere.</span><br>
    <a href="#" id="relink" class="relink">Different panel? Re-link</a>
  </footer>

</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Recent alerts">
  <div class="sheet-head">
    <h2>Recent Alerts<small>Last 12 hours</small></h2>
    <button id="sheet-close" aria-label="Close">&times;</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
(function () {
  "use strict";

  // ---- Topic comes from the URL fragment the panel's QR encodes ----------
  // Accepts "#t=topic" and a bare "#topic" so a hand-typed link still works.
  function readTopic() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return "";
    var m = /(?:^|&)t=([^&]+)/.exec(h);
    var raw = m ? m[1] : h;
    try { raw = decodeURIComponent(raw); } catch (e) { /* use as-is */ }
    // Only ntfy-legal characters; silently drop anything else so a mangled
    // link can never be turned into a request somewhere unintended.
    return (raw.match(/[A-Za-z0-9_-]+/g) || []).join("").slice(0, 64);
  }

  // A home-screen launch on Android opens the manifest's start_url, which
  // cannot carry this panel's fragment -- so the topic is persisted the first
  // time the QR link is opened and read back whenever the fragment is absent.
  var STORE_KEY = "panel.topic";

  function remember(t) {
    try { localStorage.setItem(STORE_KEY, t); } catch (e) { /* private mode */ }
  }
  function recall() {
    try { return localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  var topic = readTopic();
  if (topic) {
    remember(topic);          // fresh scan wins, and re-pairing just overwrites
  } else {
    topic = recall();
  }

  var wrap  = document.getElementById("wrap");

  if (!topic) {
    // Recovery path for any launch that arrives without a topic: the topic
    // is printed on the panel's Phone Setup screen, so it can be pasted.
    wrap.innerHTML =
      '<div class="nolink"><strong>No panel linked</strong>' +
      'Open your panel, go to Settings &rsaquo; Network &rsaquo; Phone setup, ' +
      'and scan the code shown there.<br><br>' +
      'Or enter the topic shown on that screen:' +
      '<div class="topic-row" style="margin-top:14px">' +
      '<input id="paste" inputmode="text" autocapitalize="none" autocorrect="off" ' +
      'spellcheck="false" placeholder="e.g. pine-terrace-efyf" ' +
      'style="flex:1;border:0;background:transparent;font:inherit;font-size:14px;' +
      'color:var(--ink);outline:none;min-width:0">' +
      '<button class="copy" id="paste-go">Link</button></div></div>';
    var go = function () {
      // Case is kept: ntfy topics are case-sensitive and the panel stores its
      // topic exactly as entered, so "Aravanya" and "aravanya" are different.
      var v = (document.getElementById("paste").value || "").trim();
      v = (v.match(/[A-Za-z0-9_-]+/g) || []).join("").slice(0, 64);
      if (!v) return;
      remember(v);
      location.replace(location.pathname + "#t=" + v);
      location.reload();
    };
    document.getElementById("paste-go").addEventListener("click", go);
    document.getElementById("paste").addEventListener("keydown", function (e) {
      if (e.key === "Enter") go();
    });
    return;
  }

  // ---- Runtime manifest -----------------------------------------------
  // Built here, after the topic is known, so the installed app's start_url
  // carries THIS panel's topic. Absolute URLs throughout: a blob: manifest
  // has no base to resolve relative paths against.
  (function installManifest() {
    var base = location.origin + location.pathname.replace(/[^\/]*$/, "");
    var self = location.origin + location.pathname;
    var manifest = {
      id: self + "#t=" + topic,
      name: "Home Panel",
      short_name: "Panel",
      description: "Controls for your home panel.",
      start_url: self + "#t=" + topic,
      scope: base,
      display: "standalone",
      orientation: "portrait",
      background_color: "#F6E9CC",
      theme_color: "#F6E9CC",
      icons: [
        { src: base + "icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
        { src: base + "icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
        { src: base + "icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    try {
      var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      var link = document.createElement("link");
      link.rel = "manifest";
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    } catch (e) { /* no manifest: the apple-* meta tags and the URL still carry it */ }
  })();

  // ---- Service worker ---------------------------------------------------
  // Required for the browser's install prompt on Android, and gives the page
  // an offline shell (the buttons still need the network; the page itself
  // does not). Registered with the plain relative path so it scopes to this
  // folder only.
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("./sw.js"); } catch (e) { /* optional */ }
  }

  // ---- Add to home screen -------------------------------------------------
  (function installUx() {
    var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                     navigator.standalone === true;
    var foot = document.getElementById("foot");
    if (standalone) {               // already installed: nothing to suggest
      if (foot) foot.innerHTML = "Commands reach the panel from anywhere.";
      return;
    }
    var box   = document.getElementById("install");
    var text  = document.getElementById("install-text");
    var add   = document.getElementById("install-add");
    var later = document.getElementById("install-later");
    var DISMISS_KEY = "panel.install.later";
    function dismissed() { try { return sessionStorage.getItem(DISMISS_KEY) === "1"; } catch (e) { return false; } }
    later.addEventListener("click", function () {
      box.classList.remove("show");
      try { sessionStorage.setItem(DISMISS_KEY, "1"); } catch (e) { /* ignore */ }
    });

    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    // Android / Chrome: the browser hands us its own install prompt. One tap.
    var deferred = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferred = e;
      if (dismissed()) return;
      text.innerHTML = "<strong>Add to your home screen</strong><br>One tap, then it opens like an app.";
      add.style.display = "";
      box.classList.add("show");
    });
    add.addEventListener("click", function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; box.classList.remove("show"); });
    });
    window.addEventListener("appinstalled", function () { box.classList.remove("show"); });

    // iPhone: Safari has no install API. Point at the exact two taps.
    if (isIOS && !dismissed()) {
      var share = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      text.innerHTML = "<strong>Add to your home screen</strong><br>Tap " + share +
                       " below, then <strong>Add to Home Screen</strong>.";
      add.style.display = "none";
      box.classList.add("show");
    }
  })();

  var CMD_URL = "https://ntfy.sh/" + topic + "-cmd";

  // ---- Re-link ------------------------------------------------------------
  // A saved topic otherwise sticks forever: if the panel was reset (new
  // topic) or this phone should drive a different panel, forget it and show
  // the scan / paste screen. Dropping the fragment matters too -- an installed
  // app relaunches with the old #t= otherwise.
  function relink() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
    location.replace(location.pathname);
  }
  document.getElementById("relink").addEventListener("click", function (e) {
    e.preventDefault();
    relink();
  });

  document.getElementById("badge").textContent      = topic;
  document.getElementById("topic-text").textContent = topic;

  // ---- Status line -------------------------------------------------------
  var statusEl = document.getElementById("status");
  var statusTimer = null;

  function say(msg, isError, holdMs) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("err", !!isError);
    statusEl.classList.add("show");
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
      statusEl.classList.remove("show");
    }, holdMs || 4200);
  }

  // ---- Reading what the panel says back -----------------------------------
  // The relay keeps every message for 12 hours, so the phone can read the
  // panel's confirmations straight from the relay's cache. The panel is not
  // involved in any of these reads -- it only ever sees the commands.
  var MAIN_URL = "https://ntfy.sh/" + topic + "/json?poll=1&since=";
  var VER_URL  = "https://ntfy.sh/" + topic + "-ver/json?poll=1&since=";
  var MARK = "✓ ";   // the panel prefixes its own replies with a checkmark

  function nowSec() { return Math.floor(Date.now() / 1000); }

  function pollTopic(url, since) {
    return fetch(url + since, { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (body) {
        var out = [];
        body.split("\n").forEach(function (line) {
          try {
            var m = JSON.parse(line);
            if (m.event === "message") out.push({ time: m.time || 0, title: m.title || "", message: m.message || "" });
          } catch (e) { /* framing / blank */ }
        });
        return out;
      })
      .catch(function () { return []; });
  }

  // Replies the panel posted at or after `since` (unix seconds), oldest first.
  function panelReplies(since) {
    return pollTopic(MAIN_URL, since).then(function (list) {
      return list.filter(function (m) { return m.message.indexOf(MARK) === 0 && m.time >= since; })
                 .map(function (m) { m.message = m.message.slice(MARK.length); return m; });
    });
  }

  // Resolves with the first reply matching `test` within timeoutMs, else "".
  function waitReply(since, timeoutMs, test) {
    var deadline = Date.now() + timeoutMs;
    return new Promise(function (resolve) {
      (function poll() {
        panelReplies(since).then(function (list) {
          for (var i = 0; i < list.length; i++) {
            if (!test || test(list[i].message)) return resolve(list[i].message);
          }
          if (Date.now() < deadline) setTimeout(poll, 2000); else resolve("");
        });
      })();
    });
  }

  // Ask the panel which firmware it runs. The panel answers on <topic>-ver
  // (which no phone subscribes to) at most once every 20 s, so an answer it
  // gave in the last 25 s is accepted too -- otherwise a quick reload would
  // look like a dead panel.
  var verInFlight = null;
  function askVersion(timeoutMs) {
    if (verInFlight) return verInFlight;
    var since = nowSec() - 25;
    var deadline = Date.now() + (timeoutMs || 12000);
    fetch(CMD_URL, { method: "POST", body: "ver", mode: "no-cors" }).catch(function () {});
    verInFlight = new Promise(function (resolve) {
      (function poll() {
        pollTopic(VER_URL, since).then(function (list) {
          var found = "";
          list.forEach(function (m) { if (/^\d+\.\d+\.\d+$/.test(m.message)) found = m.message; });
          if (found) return resolve(found);
          if (Date.now() < deadline) setTimeout(poll, 1500); else resolve("");
        });
      })();
    }).then(function (v) { verInFlight = null; return v; });
    return verInFlight;
  }

  // ---- Confirmed-tick feedback -------------------------------------------
  // A short vibration on phones that allow it (Android; iPhone Safari has no
  // vibration API, so the visual tick carries it there) plus a one-second
  // gold flash with a checkmark on the button that was pressed.
  function tick(btn, label) {
    try { if (navigator.vibrate) navigator.vibrate(18); } catch (e) { /* ignore */ }
    btn.classList.add("sent");
    btn.textContent = "\u2713  " + label;
    setTimeout(function () { btn.classList.remove("sent"); btn.textContent = label; }, 1100);
  }

  // ---- Sending -----------------------------------------------------------
  // Tries a normal request first (to catch a genuine network failure and say
  // so) and falls back to no-cors, which always goes through regardless of
  // CORS headers. Then it reads the panel's own confirmation off the relay
  // and shows it, so the status line reports what actually happened.
  function send(cmd, btn, restore) {
    btn.disabled = true;
    say("Sending…");
    var since = nowSec() - 1;

    fetch(CMD_URL, { method: "POST", body: cmd })
      .then(function () { return true; })
      .catch(function () {
        return fetch(CMD_URL, { method: "POST", body: cmd, mode: "no-cors" })
          .then(function () { return true; })
          .catch(function () { return false; });
      })
      .then(function (sent) {
        btn.disabled = false;
        btn.textContent = restore;
        btn.classList.remove("confirm");
        if (!sent) { say("No connection. Try again.", true); return; }
        say("Sent — waiting for the panel…", false, 20000);
        return waitReply(since, 18000).then(function (reply) {
          if (reply) {
            say(reply, false, 9000);
            tick(btn, restore);
            link.online();
            if (/^Restarting/.test(reply)) setTimeout(function () { link.check(); }, 35000);
          } else {
            say("Sent, but no confirmation yet — the panel may be reconnecting. It will catch up on its own.", true, 9000);
            link.check();
          }
        });
      });
  }

  // ---- Wiring ------------------------------------------------------------
  // Destructive actions ask twice: a pocket tap must never reboot the panel
  // mid-evening.
  var pendingTimer = null;

  function wire(id, cmd) {
    var btn   = document.getElementById(id);
    var label = btn.textContent;
    var armed = false;

    btn.addEventListener("click", function () {
      if (btn.dataset.confirm && !armed) {
        armed = true;
        btn.textContent = "Tap again to confirm";
        btn.classList.add("confirm");
        clearTimeout(pendingTimer);
        pendingTimer = setTimeout(function () {
          armed = false;
          btn.textContent = label;
          btn.classList.remove("confirm");
        }, 3500);
        return;
      }
      clearTimeout(pendingTimer);
      armed = false;
      send(cmd, btn, label);
    });
  }

  wire("btn-off",     "off");
  wire("btn-status",  "status");
  wire("btn-restart", "restart");

  // ---- Link check, update offer, update progress ---------------------------
  // On open the panel is asked for its version. If it answers, the published
  // version (firmware/manifest.json on this host) is compared and an Update
  // row appears when newer. If it does not answer, the page says so and keeps
  // asking quietly in the background -- a panel that is restarting or whose
  // Wi-Fi dropped comes back on its own, and the row disappears the moment it
  // does. Nobody has to reload, and nothing has to be power-cycled.
  var link = (function () {
    var box   = document.getElementById("update");
    var text  = document.getElementById("update-text");
    var steps = document.getElementById("update-steps");
    var btn   = document.getElementById("btn-upgrade");
    var badge = document.getElementById("badge");

    var running = "", latest = "", mode = "";   // mode: "" | "offline" | "offer" | "updating"
    var retryTimer = null, offlineSince = 0;

    function parts(v) { return String(v || "").split(".").map(function (n) { return parseInt(n, 10) || 0; }); }
    function newer(a, b) {
      var x = parts(a), y = parts(b);
      for (var i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
      return false;
    }
    function show(cls) {
      box.className = "update show" + (cls ? " " + cls : "");
    }
    function hide() { box.className = "update"; steps.textContent = ""; }
    function setBtn(label) { btn.style.display = ""; btn.disabled = false; btn.textContent = label; btn.classList.remove("confirm"); }

    var published = fetch("firmware/manifest.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (m) { latest = (m && m.version) || ""; })
      .catch(function () {});

    function gotVersion(v) {
      running = v;
      badge.textContent = topic + "  ·  v" + running;
      if (mode === "offline") { hide(); mode = ""; say("Panel is back online.", false, 5000); }
      clearTimeout(retryTimer); retryTimer = null; offlineSince = 0;
      if (mode === "updating") return;
      published.then(function () {
        if (latest && newer(latest, running)) {
          mode = "offer";
          text.innerHTML = "<strong>Update available</strong><br>Version " + latest + " &middot; you have " + running;
          setBtn("Update");
          show();
        }
      });
    }

    function wentQuiet() {
      if (mode === "updating") return;
      if (!offlineSince) offlineSince = Date.now();
      mode = "offline";
      var mins = Math.round((Date.now() - offlineSince) / 60000);
      text.innerHTML = "<strong>Panel isn't answering</strong><br>" +
        (mins < 1 ? "Checking again in the background. A panel that is restarting or lost Wi-Fi comes back on its own; the buttons work again the moment it does."
                  : "Still quiet after " + mins + " min. If it stays like this, check its Wi-Fi from the panel's own settings screen. " +
                    "If the panel was set up again, re-link it from the Phone setup screen.");
      setBtn("Retry");
      show();
      // Every 30 s for the first ten minutes, then every 2 min. Paused while
      // the page is hidden, so a backgrounded app never keeps sending.
      var wait = (Date.now() - offlineSince < 600000) ? 30000 : 120000;
      clearTimeout(retryTimer);
      retryTimer = setTimeout(check, wait);
    }

    function check() {
      if (document.hidden) { retryTimer = setTimeout(check, 15000); return; }
      return askVersion(12000).then(function (v) { if (v) gotVersion(v); else wentQuiet(); });
    }

    document.addEventListener("visibilitychange", function () {
      // Coming back to the app after a while: one fresh look, no waiting.
      if (!document.hidden && mode === "offline") { clearTimeout(retryTimer); check(); }
    });

    // ---- Update progress --------------------------------------------------
    // The panel narrates the update on the main topic ("Downloading update",
    // "downloaded. Installing now", "Update failed: ..."), then reboots. The
    // page follows those replies, and once the panel has gone down for the
    // install it asks for the version until the new one answers.
    function runUpdate() {
      mode = "updating";
      var since = nowSec() - 1, target = latest, deadline = Date.now() + 8 * 60000;
      btn.style.display = "none";
      show();
      function stage(title, body, s) {
        text.innerHTML = "<strong>" + title + "</strong><br>" + body;
        steps.innerHTML = s;
      }
      function bar(n) {   // 1 sent, 2 downloading, 3 installing, 4 done
        var names = ["Sent", "Downloading", "Installing", "Done"];
        return names.map(function (nm, i) { return i + 1 <= n ? "<b>" + nm + "</b>" : nm; }).join(" &rsaquo; ");
      }
      function fail(why) {
        mode = "";
        text.innerHTML = "<strong>Update didn't finish</strong><br>" + why;
        steps.textContent = "";
        setBtn("Try again");
        show("fail");
      }
      stage("Updating to " + target, "Asking the panel to download it…", bar(1));
      fetch(CMD_URL, { method: "POST", body: "upgrade", mode: "no-cors" }).catch(function () {});

      var seenInstall = false;
      (function follow() {
        if (Date.now() > deadline) return fail("No word from the panel for 8 minutes. Reopen this page later to see which version it runs.");
        panelReplies(since).then(function (list) {
          list.forEach(function (m) {
            var t = m.message;
            if (/^Downloading update/.test(t))              stage("Updating to " + target, "Downloading on the panel… this takes about a minute.", bar(2));
            else if (/downloaded\. Installing/.test(t))     { seenInstall = true; stage("Updating to " + target, "Downloaded and verified. Installing — the panel restarts itself; back in about a minute.", bar(3)); }
            else if (/^Update failed/.test(t))              { fail(t.replace(/^Update failed:\s*/, "")); seenInstall = "fail"; }
            else if (/^Already up to date/.test(t))         { mode = ""; text.innerHTML = "<strong>Already up to date</strong><br>" + t; steps.textContent = ""; show("done"); seenInstall = "done"; }
            else if (/^No WiFi|^SD card/.test(t))           { fail(t); seenInstall = "fail"; }
          });
          if (seenInstall === "fail" || seenInstall === "done") return;
          if (!seenInstall) return setTimeout(follow, 2500);
          // Installing: wait for the reboot, then ask for the version until
          // the new one answers (the panel answers at most once per 20 s).
          setTimeout(function confirmVersion() {
            if (Date.now() > deadline) return fail("The panel restarted but hasn't reported the new version yet. Reopen this page in a minute.");
            askVersion(10000).then(function (v) {
              if (v && !newer(target, v)) {
                mode = ""; running = v;
                badge.textContent = topic + "  ·  v" + v;
                text.innerHTML = "<strong>Updated to " + v + "</strong><br>The panel is back and running the new version.";
                steps.innerHTML = bar(4);
                show("done");
                setTimeout(hide, 20000);
              } else if (v) {
                // Still the old version: the install was rejected at boot.
                fail("The panel came back on " + v + " — the new image was not applied. Try again.");
              } else {
                setTimeout(confirmVersion, 25000);
              }
            });
          }, 30000);
        });
      })();
    }

    var armed = false, armTimer = null;
    btn.addEventListener("click", function () {
      if (mode === "offline") { clearTimeout(retryTimer); btn.disabled = true; btn.textContent = "Checking…"; check().then(function () { btn.disabled = false; }); return; }
      if (mode === "updating") return;
      if (!armed) {
        armed = true;
        btn.textContent = "Tap again";
        btn.classList.add("confirm");
        armTimer = setTimeout(function () { armed = false; btn.textContent = mode === "offer" ? "Update" : "Try again"; btn.classList.remove("confirm"); }, 3500);
        return;
      }
      clearTimeout(armTimer);
      armed = false;
      runUpdate();
    });

    // A beat after load, so opening the page stays instant.
    setTimeout(check, 600);

    return {
      check: function () { if (mode !== "updating") { clearTimeout(retryTimer); check(); } },
      online: function () { if (mode === "offline") { clearTimeout(retryTimer); check(); } }
    };
  })();

  // ---- Activity sheet -------------------------------------------------------
  // Everything the panel has pushed in the last 12 hours -- doorbell, motion,
  // light notices and its replies to commands -- straight from the relay's
  // cache. The panel is not contacted; this is the phone reading ntfy.
  (function activity() {
    var btnLog = document.getElementById("btn-log");
    var sheet  = document.getElementById("sheet");
    var bg     = document.getElementById("sheet-bg");
    var list   = document.getElementById("log");

    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
    function hhmm(t) {
      var d = new Date(t * 1000), h = d.getHours(), m = d.getMinutes();
      return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
    }
    function open() {
      sheet.classList.add("open"); bg.classList.add("open");
      list.innerHTML = '<div class="log-empty">Loading…</div>';
      pollTopic(MAIN_URL, "12h").then(function (msgs) {
        msgs.sort(function (a, b) { return b.time - a.time; });
        msgs = msgs.slice(0, 80);
        if (!msgs.length) {
          list.innerHTML = '<div class="log-empty">No alerts in the last 12 hours.</div>';
          return;
        }
        list.innerHTML = msgs.map(function (m) {
          var ok = m.message.indexOf(MARK) === 0;
          var body = ok ? m.message.slice(MARK.length) : m.message;
          var title = ok ? "" : (m.title ? "<em>" + esc(m.title) + " &middot; </em>" : "");
          return '<div class="log-row' + (ok ? " ok" : "") + '"><div class="log-time">' + hhmm(m.time) +
                 '</div><div class="log-text">' + title + esc(body) + '</div></div>';
        }).join("");
      });
    }
    function close() { sheet.classList.remove("open"); bg.classList.remove("open"); }
    btnLog.addEventListener("click", open);
    bg.addEventListener("click", close);
    document.getElementById("sheet-close").addEventListener("click", close);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  })();

  // ---- Copy topic --------------------------------------------------------
  document.getElementById("btn-copy").addEventListener("click", function () {
    var btn = this;
    function done() {
      btn.textContent = "Copied";
      setTimeout(function () { btn.textContent = "Copy"; }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(topic).then(done).catch(fallback);
    } else {
      fallback();
    }
    function fallback() {
      // Older iOS Safari: select the text so one long-press copies it.
      var r = document.createRange();
      r.selectNodeContents(document.getElementById("topic-text"));
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      done();
    }
  });
})();
</script>
</body>
</html>
